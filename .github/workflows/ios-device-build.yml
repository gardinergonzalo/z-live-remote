name: iOS Device Build

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-device-build.yml"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned iPhone app
        working-directory: ios
        run: |
          xcodebuild \
            -project ZLiveRemote.xcodeproj \
            -scheme ZLiveRemote \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/Z Live Remote.app" Payload/ZLiveRemote.app
          zip -qry ZLiveRemote-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZLiveRemote-unsigned-IPA
          path: ios/ZLiveRemote-unsigned.ipa
          if-no-files-found: error
