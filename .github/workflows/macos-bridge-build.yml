name: macOS Bridge Build

on:
  push:
    paths:
      - "mac/bridge/**"
      - "scripts/generate-zlive-icon.py"
      - ".github/workflows/macos-bridge-build.yml"
  pull_request:
    paths:
      - "mac/bridge/**"
      - "scripts/generate-zlive-icon.py"

jobs:
  build-intel:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show architecture
        run: uname -m

      - name: Build release bridge
        run: swift build -c release --package-path mac/bridge

      - name: Package menu bar app
        run: |
          python3 -m venv .venv-icon
          .venv-icon/bin/python -m pip install --quiet pillow
          .venv-icon/bin/python scripts/generate-zlive-icon.py dist/ZLiveIcon-1024.png

          APP="dist/Z Live Remote Bridge.app"
          ICONSET="dist/AppIcon.iconset"

          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$ICONSET"

          cp mac/bridge/.build/release/ZLiveRemoteBridge "$APP/Contents/MacOS/ZLiveRemoteBridge"
          cp mac/bridge/Info.plist "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/ZLiveRemoteBridge"

          sips -z 16 16 dist/ZLiveIcon-1024.png --out "$ICONSET/icon_16x16.png" >/dev/null
          sips -z 32 32 dist/ZLiveIcon-1024.png --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 dist/ZLiveIcon-1024.png --out "$ICONSET/icon_32x32.png" >/dev/null
          sips -z 64 64 dist/ZLiveIcon-1024.png --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 dist/ZLiveIcon-1024.png --out "$ICONSET/icon_128x128.png" >/dev/null
          sips -z 256 256 dist/ZLiveIcon-1024.png --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 dist/ZLiveIcon-1024.png --out "$ICONSET/icon_256x256.png" >/dev/null
          sips -z 512 512 dist/ZLiveIcon-1024.png --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 dist/ZLiveIcon-1024.png --out "$ICONSET/icon_512x512.png" >/dev/null
          cp dist/ZLiveIcon-1024.png "$ICONSET/icon_512x512@2x.png"

          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"

          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "ZLiveRemoteBridge-macOS-Intel.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZLiveRemoteBridge-macOS-Intel
          path: ZLiveRemoteBridge-macOS-Intel.zip
          if-no-files-found: error
