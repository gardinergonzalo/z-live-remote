name: macOS Bridge Build

on:
  push:
    paths:
      - "mac/bridge/**"
      - ".github/workflows/macos-bridge-build.yml"
  pull_request:
    paths:
      - "mac/bridge/**"

jobs:
  build-intel:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show architecture
        run: uname -m

      - name: Build release bridge
        run: swift build -c release --package-path mac/bridge

      - name: Package menu bar app
        run: |
          APP="dist/Z Live Remote Bridge.app"
          mkdir -p "$APP/Contents/MacOS"
          cp mac/bridge/.build/release/ZLiveRemoteBridge "$APP/Contents/MacOS/ZLiveRemoteBridge"
          cp mac/bridge/Info.plist "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/ZLiveRemoteBridge"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "ZLiveRemoteBridge-macOS-Intel.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZLiveRemoteBridge-macOS-Intel
          path: ZLiveRemoteBridge-macOS-Intel.zip
          if-no-files-found: error
