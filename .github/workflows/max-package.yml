name: Max Component Package

on:
  workflow_dispatch:
  push:
    paths:
      - "ableton/**"
      - ".github/workflows/max-package.yml"

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check ableton/zlr_scene_reader.js
          node --check ableton/zlr_transport.js

      - name: Package Max component
        run: |
          mkdir -p dist/ZLiveRemote-Max-v0.4.1
          cp ableton/zlr_scene_reader.js dist/ZLiveRemote-Max-v0.4.1/
          cp ableton/zlr_transport.js dist/ZLiveRemote-Max-v0.4.1/
          cp ableton/README.md dist/ZLiveRemote-Max-v0.4.1/
          cp ableton/VERSION.txt dist/ZLiveRemote-Max-v0.4.1/
          cd dist
          zip -qr ZLiveRemote-Max-v0.4.1.zip ZLiveRemote-Max-v0.4.1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ZLiveRemote-Max-v0.4.1
          path: dist/ZLiveRemote-Max-v0.4.1.zip
          if-no-files-found: error
