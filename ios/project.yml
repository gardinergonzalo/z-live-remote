name: ZLiveRemote

options:
  bundleIdPrefix: com.zliveremote
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  ZLiveRemote:
    type: application
    platform: iOS
    sources:
      - path: ZLiveRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zliveremote.app
        PRODUCT_NAME: Z Live Remote
        MARKETING_VERSION: 0.4.0
        CURRENT_PROJECT_VERSION: 4
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Z Live Remote
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Z Live Remote usa Bluetooth para conectarse de forma directa con la Mac que ejecuta Ableton Live.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: false
